[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-sysmon"
version = "0.5.0"
description = "Read-only Linux system monitor with a Rich dashboard for Termux/Ubuntu"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
sysmon = "sysmon.cli:main"

[tool.setuptools.packages.find]
include = ["sysmon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["sysmon"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "E501",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "PIE",
    "RUF",
    "SIM",
    "ISC",
    "PT",
    "RET",
    "BLE",
    "T20",
    "PTH",
    "FA",
    "FLY",
    "LOG",
    "G",
    "DTZ",
    "PERF",
]

[tool.ruff.lint.per-file-ignores]
# Printing JSON/lines is the whole point of the CLI entry point.
"sysmon/cli.py" = ["T201"]
# Fixtures use long sample payloads and compound assertions on purpose.
"tests/*" = ["E501", "PT018"]

[tool.mypy]
python_version = "3.10"
files = ["sysmon", "tests"]
strict = true
warn_unreachable = true
