[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-sysmon"
version = "0.4.0"
description = "Read-only Linux system monitor with a Rich dashboard for Termux/Ubuntu"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7,<16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sysmon = "sysmon.cli:main"

[tool.setuptools.packages.find]
include = ["sysmon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
